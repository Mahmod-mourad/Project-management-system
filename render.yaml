services:
  - type: web
    name: pms-api
    runtime: node
    plan: free
    buildCommand: corepack enable && cd backend && npm ci && npm run build
    startCommand: cd backend && npm run start:prod
    rootDir: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false