# The two applications. The database is Supabase.
#
# This file used to start PostgreSQL, Redis and Nginx alongside them. None of
# the three was connected to anything:
#
#   - the API reads SUPABASE_URL and talks to Supabase's REST endpoint. It never
#     opens a database connection, so DB_HOST, DB_PORT, DB_USER, DB_PASSWORD and
#     DB_NAME were passed to a container that ignored them, and the PostgreSQL
#     service sat there with the schema loaded and no client.
#   - "redis" appears nowhere in backend/src or in the frontend.
#   - nginx mounted ./ssl, a directory that does not exist in this repository.
#
# It also set NEXT_PUBLIC_API_URL to http://backend:3001/api while main.ts sets
# a global prefix of api/v1, so the browser app 404'd on every call.
#
# Bring up Supabase first — `npx supabase start`, or a hosted project — apply
# scripts/ in order, then put its URL and service role key in .env.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pms-backend
    environment:
      NODE_ENV: production
      # host.docker.internal reaches a Supabase running on the host. For a
      # hosted project, set SUPABASE_URL in .env and this passes it through.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The browser makes this request, not the container, so it is the host's
        # address rather than the compose service name. The /api/v1 prefix is
        # required: main.ts sets it globally. It is a build argument because
        # Next.js inlines NEXT_PUBLIC_* at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: pms-frontend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
