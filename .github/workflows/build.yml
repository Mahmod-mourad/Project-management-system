name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend

    steps:
      - uses: actions/checkout@v4

      # pnpm is set up before Node so setup-node can cache the pnpm store.
      # The version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Unit tests
        run: pnpm test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    name: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This step could not have existed before: the package had no ESLint
      # config, so the lint script errored out saying every file was ignored.
      - name: Lint
        run: pnpm --filter erp-backend lint

      - name: Build
        run: pnpm --filter erp-backend build

      - name: Unit tests
        run: pnpm --filter erp-backend exec jest --runInBand

  schema:
    runs-on: ubuntu-latest
    name: Database schema

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # scripts/ used to be five files that could not run in order — one
      # ALTERed tables nothing creates, one used MySQL syntax. Nothing caught
      # that, because nothing ever ran them. This does, twice, so the scripts
      # stay both correct and re-runnable.
      - name: Apply the schema, then apply it again
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pms_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f .github/auth-schema-stub.sql
          for pass in 1 2; do
            echo "pass $pass"
            for f in scripts/*.sql; do
              echo "  $f"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

  docker:
    runs-on: ubuntu-latest
    name: Docker images
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pms-frontend:${{ github.sha }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: pms-backend:${{ github.sha }}
